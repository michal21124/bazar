<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />

    <!-- Primary SEO (overridden per-page by react-helmet-async) -->
    <title>Autobazar Platinum Cars – Prémiová ojetá auta | Klíčany u Prahy</title>
    <meta name="description" content="Autobazar Platinum Cars — prémiová ojetá vozidla v Klíčanech-Vodochodech u Prahy. Výkup, prodej a výměna vozů. ☎ +420 777 876 406" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Autobazar Platinum Cars" />
    <meta name="keywords" content="autobazar Praha, ojetá auta Praha, prodej aut Klíčany, výkup aut Praha, prémiová auta, BMW ojeté, Audi ojeté, Mercedes ojeté" />
    <link rel="canonical" href="https://platinumcars.cz/" />

    <!-- Open Graph (Google, Facebook, SMS, iMessage, WhatsApp previews) -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Autobazar Platinum Cars" />
    <meta property="og:title"       content="Autobazar Platinum Cars – Prémiová ojetá auta | Klíčany u Prahy" />
    <meta property="og:description" content="Prověřená prémiová ojetá vozidla v Klíčanech-Vodochodech u Prahy. Výkup, prodej a výměna vozů." />
    <meta property="og:url"         content="https://platinumcars.cz/" />
    <meta property="og:image"       content="https://platinumcars.cz/logo.png" />
    <meta property="og:image:width"  content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt"   content="Autobazar Platinum Cars logo" />
    <meta property="og:locale"      content="cs_CZ" />

    <!-- Twitter / X card -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="Autobazar Platinum Cars – Prémiová ojetá auta" />
    <meta name="twitter:description" content="Prémiová ojetá vozidla v Klíčanech u Prahy. Výkup, prodej, výměna." />
    <meta name="twitter:image"       content="https://platinumcars.cz/logo.png" />
    <meta name="twitter:image:alt"   content="Autobazar Platinum Cars logo" />

    <!-- Sitemap -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Favicon — browser tab, bookmarks, Google search result icon -->
    <link rel="icon"             type="image/png" sizes="32x32"  href="/logo.png" />
    <link rel="icon"             type="image/png" sizes="16x16"  href="/logo.png" />
    <link rel="shortcut icon"    type="image/png"                href="/logo.png" />
    <!-- Apple home screen icon (iOS Safari, iMessage link preview) -->
    <link rel="apple-touch-icon" sizes="180x180"                 href="/logo.png" />
    <!-- Android Chrome, PWA -->
    <link rel="icon"             type="image/png" sizes="192x192" href="/logo.png" />
    <link rel="icon"             type="image/png" sizes="512x512" href="/logo.png" />
    <meta name="theme-color" content="#1B3664" />
    <meta name="msapplication-TileImage" content="/logo.png" />
    <meta name="msapplication-TileColor" content="#1B3664" />

    <!-- Fonts (must stay first in CSS — handled via index.css @import) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <!-- Hidden form for Netlify build-bot detection -->
    <form name="contact" data-netlify="true" hidden>
      <input type="text" name="name" />
      <input type="text" name="contact" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
